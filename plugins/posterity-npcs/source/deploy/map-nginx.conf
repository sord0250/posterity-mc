# BlueMap and the ArcEmployees build planner at <web.public-url>, e.g.
# https://your-domain.example/map/, for players signed in from the game (/map).
#   /map/      BlueMap (127.0.0.1:8100), only with a planner session cookie
#   /map/arc/  ArcEmployees (127.0.0.1:8101): sign-in, planner, API, and the
#              blueprint/house upload page (/map/arc/upload/<token>)
# Setup: copy this file to /etc/nginx/snippets/arc-map.conf, add
#   include /etc/nginx/snippets/arc-map.conf;
# inside your site's HTTPS server { } block, then `nginx -t` and reload nginx.
# Undo: remove that include line (and the file) and reload nginx.
location = /map { return 301 /map/; }
location = /map/_arc_auth {
    internal;
    proxy_pass http://127.0.0.1:8101/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location /map/arc/ {
    proxy_pass http://127.0.0.1:8101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;   # uploads: blueprints.max-download-mb (50) plus room
    proxy_read_timeout 60s;
}
location /map/ {
    auth_request /map/_arc_auth;
    error_page 401 = @arc_map_signin;
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
location @arc_map_signin { return 302 /map/arc/signin; }
