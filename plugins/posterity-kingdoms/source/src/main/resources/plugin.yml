name: PosterityKingdoms
version: '${project.version}'
main: site.remotearc.kingdom.PosterityKingdoms
api-version: '26.2'
authors: [Posterity]
description: Place a Kingdom Core (bedrock) to found your kingdom, so NPCs can be told apart by whose kingdom they belong to.
softdepend: [Vault, ArcEmployees]
commands:
  kingdom:
    description: Found a kingdom (place its Core) and run it.
    usage: /kingdom [help|core|info|addruler|removeruler|leave|flag|money|delete|reload]
    aliases: [kd, kingdoms]
    permission: posteritykingdoms.use
permissions:
  posteritykingdoms.use:
    description: Found a kingdom, manage its rulers, leave one.
    default: true
  posteritykingdoms.admin:
    description: Disband any kingdom, give yourself money, reload.
    default: op
